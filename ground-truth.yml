    area: packages
    question: Which Angular and SignalR client versions does the app use?
    expected: "@angular/core ^22.2.0 and @microsoft/signalr ^10.0.11."
    evidence:
      - package.json:16
      - package.json:20

  - id: web-base-url
    area: config
    question: Where does the backend base URL come from, per build configuration?
    expected: environment.apiUrl. Production build (environment.ts) uses https://app-lab-leasing-dev.azurewebsites.net; the development configuration replaces it with environment.development.ts, http://localhost:5080. hubPath is /hubs/leasing in both.
    evidence:
