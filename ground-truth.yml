  - id: web-interceptor
    area: authorization
    question: How is the access token attached to requests?
    expected: The functional interceptor authTokenInterceptor, registered with provideHttpClient(withInterceptors(...)), adds "Authorization Bearer {token}" only to requests whose URL starts with environment.apiUrl. The token is read from sessionStorage.
    evidence:
      - src/app/app.config.ts:11
      - src/app/core/auth/auth-token.interceptor.ts:7
      - src/app/core/auth/auth-token.interceptor.ts:9
      - src/app/core/auth/auth-token.interceptor.ts:12
      - src/app/core/auth/auth-token.service.ts:12

  - id: web-realtime-subscribe
    area: realtime
    question: Which SignalR hub and methods does the app subscribe to, and which lab-leasing send matches each?
    expected:
      - "Hub URL {apiUrl}/hubs/leasing, token through accessTokenFactory"
      - "flowUpdated -> lab-leasing FlowProjectionService SendToAll(\"flowUpdated\", ...)"
      - "taskAssigned -> lab-leasing FlowProjectionService SendToSpecifiedUsers(..., \"taskAssigned\", ...)"
    evidence:
      - src/app/core/realtime/leasing-hub.service.ts:20
      - src/app/core/realtime/leasing-hub.service.ts:41
      - src/app/core/realtime/leasing-hub.service.ts:42
      - src/app/app.ts:15

  - id: web-component-input-binding
    area: routing
    question: How do detail components receive the flow id?
    expected: Through router input binding (withComponentInputBinding); the ':flowId' route parameter binds to the component input flowId.
    evidence:
      - src/app/app.config.ts:10
      - src/app/features/applications/applications.routes.ts:5
