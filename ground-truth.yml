  - id: web-http-calls
    area: http
    question: Which HTTP calls do the services make, and which lab-leasing endpoint answers each?
    expected:
      - "ApplicationsService.search: GET {apiUrl}/v1/applications (query status, q) -> ApplicationsController.Search"
      - "ApplicationsService.get: GET {apiUrl}/v1/applications/{flowId} -> ApplicationsController.Get"
      - "ApplicationsService.review: POST {apiUrl}/v1/applications/{flowId}/review -> ApplicationsController.Review"
      - "ApplicationsService.withdraw: POST {apiUrl}/v1/applications/{flowId}/actions/withdraw -> ApplicationsController.Withdraw"
      - "AssessmentsService.list: GET {apiUrl}/v1/assessments -> AssessmentsController.Search"
      - "AssessmentsService.assess: POST {apiUrl}/v1/assessments/{flowId}/assess -> AssessmentsController.Assess"
      - "QuotesService.list: GET {apiUrl}/v1/quotes -> QuotesController.Search"
      - "QuotesService.get: GET {apiUrl}/v1/quotes/{flowId} -> QuotesController.Get"
      - "QuotesService.accept: POST {apiUrl}/v1/quotes/{flowId}/accept -> QuotesController.Accept"
      - "QuotesService.recalculate: POST {apiUrl}/v1/quotes/{flowId}/recalculate -> QuotesController.Recalculate"
      - "LeasesService.search: GET {apiUrl}/v1/leases (query q) -> LeasesController.Search"
      - "LeasesService.get: GET {apiUrl}/v1/leases/{flowId} -> LeasesController.Get"
      - "LeasesService.document: GET {apiUrl}/v1/leases/{flowId}/document -> LeasesController.GetDocument"
      - "LeasesService.sign: POST {apiUrl}/v1/leases/{flowId}/sign -> LeasesController.Sign"
      - "PortfolioService.summary: GET {apiUrl}/v1/admin/portfolio -> AdminController.Portfolio"
