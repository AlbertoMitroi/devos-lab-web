      - "assessments: lazy component AssessmentList"
      - "quotes: lazy children (QuoteList, QuoteDetail at ':flowId')"
      - "leases: lazy children (LeaseList, LeaseDetail at ':flowId')"
      - "admin/portfolio: lazy component Portfolio"
